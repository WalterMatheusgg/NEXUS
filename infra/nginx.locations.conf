client_max_body_size 11m;

location = /healthz {
  access_log off;
  default_type text/plain;
  return 200 'ok\n';
}

location = /api { return 308 /api/; }
location ^~ /api/ {
  # The trailing slash strips /api/: /api/auth/me becomes /auth/me.
  proxy_pass http://backend:8080/;
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Prefix /api;
  # Drop competing client-supplied forwarding headers before Spring trusts this proxy.
  proxy_set_header Forwarded '';
  proxy_set_header X-Forwarded-Port '';
  proxy_set_header X-Forwarded-Ssl '';
  proxy_set_header Connection '';
  proxy_connect_timeout 5s;
  proxy_read_timeout 60s;
  proxy_request_buffering on;
  # Cookies, Set-Cookie and X-XSRF-TOKEN pass unchanged. XSRF-TOKEN must remain readable.
  # Never force HttpOnly on all cookies; only the backend marks NEXUSSESSION HttpOnly.
  proxy_hide_header Cache-Control;
  add_header Cache-Control 'no-store' always;
  include /etc/nginx/nexus-headers.conf;
}

location ~ /\. { deny all; }

location ~* \.(?:js|css|woff2?|png|jpe?g|ico|svg)$ {
  try_files $uri =404;
  expires 1h;
}

location / {
  try_files $uri $uri/ /index.html;
  expires -1;
}
