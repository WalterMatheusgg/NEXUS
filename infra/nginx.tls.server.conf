server {
  listen 8080;
  server_name _;
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok\n';
  }
  location / { return 308 https://$host:8443$request_uri; }
}
server {
  listen 8443 ssl;
  server_name localhost;
  root /usr/share/nginx/html;
  index index.html;
  ssl_certificate /etc/nginx/tls/localhost.pem;
  ssl_certificate_key /etc/nginx/tls/localhost-key.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:TLS:10m;
  include /etc/nginx/nexus-headers.conf;
  include /etc/nginx/nexus-locations.conf;
}
