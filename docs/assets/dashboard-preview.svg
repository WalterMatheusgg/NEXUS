<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 710" width="1200" height="710" role="img" aria-label="Prévia ilustrativa do dashboard do Nexus CRM com menu lateral, indicadores, funil comercial e chamados">
<title>NEXUS CRM — prévia ilustrativa do dashboard Angular</title>
<desc>Ilustração baseada nas seções da interface implementada, não é uma captura do aplicativo em execução. Valores são demonstrativos.</desc>
