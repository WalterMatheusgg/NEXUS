spring.application.name=nexus-crm
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:18080}
spring.config.import=optional:file:../.env[.properties]
spring.datasource.url=${ORACLE_JDBC_URL}
spring.datasource.username=${ORACLE_APP_USER}
spring.datasource.password=${ORACLE_APP_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=10000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.fetch_size=50
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.mvc.problemdetails.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
server.servlet.session.timeout=${NEXUS_SESSION_TIMEOUT:30m}
server.servlet.session.cookie.name=NEXUSSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${NEXUS_COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.health.mail.enabled=false
springdoc.api-docs.enabled=${NEXUS_API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${NEXUS_API_DOCS_ENABLED:true}
springdoc.swagger-ui.csrf.enabled=true
spring.mail.host=${SMTP_HOST:127.0.0.1}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000
nexus.mail.from=${SMTP_FROM:noreply@nexus.local}
nexus.frontend-url=${NEXUS_FRONTEND_URL:http://127.0.0.1:4200}
nexus.setup-token=${NEXUS_SETUP_TOKEN:}
nexus.reset-minutes=${NEXUS_RESET_MINUTES:30}
nexus.audit-retention-days=${NEXUS_AUDIT_RETENTION_DAYS:365}
nexus.notification-retention-days=${NEXUS_NOTIFICATION_RETENTION_DAYS:90}
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.jdbc=WARN
